<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events - NXT Fund Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: '#F24E2B', dark: '#0B0E14' } } }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .sidebar-link { transition: all 0.2s; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(242,78,43,0.1); color: #F24E2B; }
    .fade-in { animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    .modal-content { animation: slideUp 0.3s ease; }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .filter-btn { transition: all 0.2s; }
    .filter-btn.active { background: #F24E2B; color: white; }
    .filter-btn:not(.active) { background: white; color: #666; border: 1px solid #e5e7eb; }
    .filter-btn:not(.active):hover { border-color: #F24E2B; color: #F24E2B; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-56 bg-dark text-white flex-shrink-0 flex flex-col fixed h-full z-30">
      <div class="p-4 border-b border-white/10">
        <a href="/admin/" class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-brand flex items-center justify-center"><span class="text-white font-bold">N</span></div>
          <div><div class="font-bold text-sm">NXT Fund</div><div class="text-gray-400 text-xs">Admin Panel</div></div>
        </a>
      </div>
      <nav class="flex-1 p-4 space-y-1">
        <a href="/admin/" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </a>
        <a href="/admin/applications.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Applications
        </a>
        <a href="/admin/events.html" class="sidebar-link active flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Events
        </a>
        <a href="/admin/blogs.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
          Blog / News
        </a>
        <a href="/admin/startups.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          Startups
        </a>
        <a href="/admin/partners.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Partners
        </a>
        <a href="/admin/contacts.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          Contacts
        </a>
        <a href="/admin/settings.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Settings
        </a>
      </nav>
      <div class="p-4 border-t border-white/10">
        <a href="/" target="_blank" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          View Site
        </a>
        <button onclick="logout()" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 w-full">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-56">
      <header class="bg-white border-b border-gray-200 px-6 py-3 sticky top-0 z-20">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-xl font-bold text-gray-900">Events</h1>
            <p class="text-gray-500 text-sm mt-0.5">Manage upcoming and past events</p>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm text-gray-500" id="event-count">0 events</span>
            <button onclick="openAddModal()" class="px-4 py-2 bg-brand text-white text-sm font-medium rounded-lg hover:bg-brand/90 transition">+ Add Event</button>
          </div>
        </div>
      </header>

      <div class="p-5 fade-in">
        <!-- Filters -->
        <div class="flex items-center gap-3 mb-6">
          <button onclick="filterEvents('all')" class="filter-btn active px-4 py-2 rounded-lg text-sm font-medium" data-filter="all">All</button>
          <button onclick="filterEvents('upcoming')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium" data-filter="upcoming">Upcoming</button>
          <button onclick="filterEvents('past')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium" data-filter="past">Past</button>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Title</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Date</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Time</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Location</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Type</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Actions</th>
                </tr>
              </thead>
              <tbody id="events-table" class="divide-y divide-gray-100">
                <tr><td colspan="6" class="px-4 py-8 text-center text-gray-400 text-sm">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Event Modal -->
  <div id="eventModal" class="fixed inset-0 z-50 hidden">
    <div class="modal-overlay absolute inset-0" onclick="closeModal()"></div>
    <div class="modal-content absolute right-0 top-0 h-full w-full max-w-2xl bg-white shadow-2xl overflow-y-auto">
      <div class="sticky top-0 bg-white border-b border-gray-100 px-4 py-2.5 flex items-center justify-between z-10">
        <h3 class="font-bold text-gray-900" id="modal-title">Add Event</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="eventForm" class="p-6 space-y-5" onsubmit="handleSubmit(event)">
        <input type="hidden" id="eventId">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
          <input type="text" id="eventTitle" required class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <textarea id="eventDescription" rows="4" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
            <input type="date" id="eventDate" required class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Time</label>
            <input type="time" id="eventTime" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
          <input type="text" id="eventLocation" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
          <select id="eventType" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
            <option value="upcoming">Upcoming</option>
            <option value="past">Past</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Image URL</label>
          <input type="url" id="eventImage" placeholder="https://..." class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
        </div>
        <div class="flex gap-3 pt-4 border-t border-gray-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-100 text-gray-600 text-sm font-medium rounded-lg hover:bg-gray-200">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-brand text-white text-sm font-medium rounded-lg hover:bg-brand/90">Save Event</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const TOKEN = localStorage.getItem('admin_token');
    if (!TOKEN) window.location.href = '/admin/login.html';

    function logout() { localStorage.removeItem('admin_token'); localStorage.removeItem('admin_user'); window.location.href = '/admin/login.html'; }

    async function api(url, options = {}) {
      const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}`, ...options.headers } });
      if (res.status === 401) { logout(); return; }
      return res.json();
    }

    let currentFilter = 'all';

    function typeBadge(type) {
      const colors = { upcoming: 'bg-green-100 text-green-700', past: 'bg-gray-100 text-gray-600' };
      return `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium ${colors[type] || 'bg-gray-100 text-gray-600'}">${type || 'N/A'}</span>`;
    }

    async function filterEvents(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-filter="${type}"]`).classList.add('active');
      await loadEvents();
    }

    async function loadEvents() {
      const events = await api(`/api/events?type=${currentFilter}`);
      const tbody = document.getElementById('events-table');
      document.getElementById('event-count').textContent = `${(events || []).length} events`;

      if (!events || events.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-400 text-sm">No events found</td></tr>';
        return;
      }

      tbody.innerHTML = events.map(e => `
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-2.5">
            <div class="font-medium text-sm text-gray-900">${e.title || 'N/A'}</div>
            ${e.image_url ? `<img src="${e.image_url}" class="w-10 h-10 rounded-lg object-cover mt-1" onerror="this.style.display='none'">` : ''}
          </td>
          <td class="px-4 py-2.5 text-sm text-gray-600">${e.date ? new Date(e.date).toLocaleDateString() : 'N/A'}</td>
          <td class="px-4 py-2.5 text-sm text-gray-600">${e.time || 'N/A'}</td>
          <td class="px-4 py-2.5 text-sm text-gray-600">${e.location || 'N/A'}</td>
          <td class="px-4 py-2.5">${typeBadge(e.type)}</td>
          <td class="px-4 py-2.5">
            <div class="flex items-center gap-2">
              <button onclick='editEvent(${JSON.stringify(e).replace(/'/g, "&#39;")})' class="px-3 py-1 bg-blue-50 text-blue-600 text-xs rounded-lg hover:bg-blue-100">Edit</button>
              <button onclick="deleteEvent('${e.id}')" class="px-3 py-1 bg-gray-100 text-gray-600 text-xs rounded-lg hover:bg-gray-200">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Add Event';
      document.getElementById('eventForm').reset();
      document.getElementById('eventId').value = '';
      document.getElementById('eventModal').classList.remove('hidden');
    }

    function editEvent(event) {
      document.getElementById('modal-title').textContent = 'Edit Event';
      document.getElementById('eventId').value = event.id;
      document.getElementById('eventTitle').value = event.title || '';
      document.getElementById('eventDescription').value = event.description || '';
      document.getElementById('eventDate').value = event.date ? event.date.split('T')[0] : '';
      document.getElementById('eventTime').value = event.time || '';
      document.getElementById('eventLocation').value = event.location || '';
      document.getElementById('eventType').value = event.type || 'upcoming';
      document.getElementById('eventImage').value = event.image_url || '';
      document.getElementById('eventModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('eventModal').classList.add('hidden'); }

    async function handleSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('eventId').value;
      const data = {
        title: document.getElementById('eventTitle').value,
        description: document.getElementById('eventDescription').value,
        date: document.getElementById('eventDate').value,
        time: document.getElementById('eventTime').value,
        location: document.getElementById('eventLocation').value,
        type: document.getElementById('eventType').value,
        image_url: document.getElementById('eventImage').value
      };

      if (id) {
        await api(`/api/events/${id}`, { method: 'PUT', body: JSON.stringify(data) });
      } else {
        await api('/api/events', { method: 'POST', body: JSON.stringify(data) });
      }
      closeModal();
      loadEvents();
    }

    async function deleteEvent(id) {
      if (!confirm('Are you sure you want to delete this event?')) return;
      await api(`/api/events/${id}`, { method: 'DELETE' });
      loadEvents();
    }

    loadEvents();
  </script>
</body>
</html>
