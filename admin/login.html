<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - NXT Fund</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { brand: '#F24E2B', dark: '#0B0E14' }
        }
      }
    }
  </script>
  <style>
    .login-bg {
      background: linear-gradient(135deg, #0B0E14 0%, #1a1f2e 50%, #0B0E14 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .input-field {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s ease;
    }
    .input-field:focus {
      background: rgba(255,255,255,0.08);
      border-color: #F24E2B;
      box-shadow: 0 0 0 3px rgba(242,78,43,0.15);
    }
    .btn-brand {
      background: linear-gradient(135deg, #F24E2B, #e03d1a);
      transition: all 0.3s ease;
    }
    .btn-brand:hover {
      background: linear-gradient(135deg, #e03d1a, #c93515);
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(242,78,43,0.3);
    }
    .glow-line {
      height: 2px;
      background: linear-gradient(90deg, transparent, #F24E2B, transparent);
    }
    @keyframes float {
      0%,100%{transform:translateY(0px)}
      50%{transform:translateY(-10px)}
    }
    .float-anim { animation: float 6s ease-in-out infinite; }
  </style>
</head>
<body class="login-bg font-sans">
  <div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="flex justify-center mb-4">
          <img src="/assets/images/logo/footer-logo.png" alt="NXT Fund" class="h-14 w-auto">
        </div>
        <p class="text-gray-400 text-sm">Admin Panel</p>
        <div class="glow-line w-20 mx-auto mt-4"></div>
      </div>

      <div class="glass-card rounded-2xl p-8">
        <h2 class="text-white text-xl font-bold mb-6">Sign In</h2>
        <div id="error-msg" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm px-4 py-3 rounded-lg mb-4"></div>

        <form id="loginForm" class="space-y-5">
          <div>
            <label class="block text-gray-300 text-sm font-medium mb-2">Email</label>
            <input type="email" id="email" required placeholder="Enter your email"
              class="input-field w-full px-4 py-3 rounded-lg text-white placeholder-gray-500 outline-none text-sm">
          </div>
          <div>
            <label class="block text-gray-300 text-sm font-medium mb-2">Password</label>
            <input type="password" id="password" required placeholder="Enter password"
              class="input-field w-full px-4 py-3 rounded-lg text-white placeholder-gray-500 outline-none text-sm">
          </div>
          <button type="submit" id="loginBtn"
            class="btn-brand w-full py-3 rounded-lg text-white font-semibold text-sm">
            Sign In
          </button>
        </form>

        <div class="mt-6 pt-5 border-t border-white/5 text-center">
        </div>
      </div>

      <p class="text-center text-gray-600 text-xs mt-6">&copy; 2026 NXT Fund. All rights reserved.</p>
    </div>
  </div>

  <script>
    if (localStorage.getItem('admin_token')) {
      window.location.href = '/admin/';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorDiv = document.getElementById('error-msg');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      btn.textContent = 'Signing in...';
      btn.disabled = true;
      errorDiv.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorDiv.textContent = data.error || 'Login failed';
          errorDiv.classList.remove('hidden');
          btn.textContent = 'Sign In';
          btn.disabled = false;
          return;
        }

        localStorage.setItem('admin_token', data.token);
        localStorage.setItem('admin_user', JSON.stringify(data.admin));
        window.location.href = '/admin/';
      } catch (err) {
        errorDiv.textContent = 'Network error. Please try again.';
        errorDiv.classList.remove('hidden');
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
