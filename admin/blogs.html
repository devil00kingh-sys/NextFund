<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog / News - NXT Fund Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: '#F24E2B', dark: '#0B0E14' } } }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .sidebar-link { transition: all 0.2s; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(242,78,43,0.1); color: #F24E2B; }
    .fade-in { animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    .modal-content { animation: slideUp 0.3s ease; }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .filter-btn { transition: all 0.2s; }
    .filter-btn.active { background: #F24E2B; color: white; }
    .filter-btn:not(.active) { background: white; color: #666; border: 1px solid #e5e7eb; }
    .filter-btn:not(.active):hover { border-color: #F24E2B; color: #F24E2B; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-56 bg-dark text-white flex-shrink-0 flex flex-col fixed h-full z-30">
      <div class="p-4 border-b border-white/10">
        <a href="/admin/" class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-brand flex items-center justify-center"><span class="text-white font-bold">N</span></div>
          <div><div class="font-bold text-sm">NXT Fund</div><div class="text-gray-400 text-xs">Admin Panel</div></div>
        </a>
      </div>
      <nav class="flex-1 p-4 space-y-1">
        <a href="/admin/" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </a>
        <a href="/admin/applications.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Applications
        </a>
        <a href="/admin/events.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Events
        </a>
        <a href="/admin/blogs.html" class="sidebar-link active flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
          Blog / News
        </a>
        <a href="/admin/startups.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          Startups
        </a>
        <a href="/admin/partners.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Partners
        </a>
        <a href="/admin/contacts.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          Contacts
        </a>
        <a href="/admin/settings.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Settings
        </a>
      </nav>
      <div class="p-4 border-t border-white/10">
        <a href="/" target="_blank" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          View Site
        </a>
        <button onclick="logout()" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 w-full">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-56">
      <header class="bg-white border-b border-gray-200 px-6 py-3 sticky top-0 z-20">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-xl font-bold text-gray-900">Blog / News</h1>
            <p class="text-gray-500 text-sm mt-0.5">Manage blog posts and news articles</p>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm text-gray-500" id="blog-count">0 posts</span>
            <button onclick="openModal()" class="px-4 py-2 bg-brand text-white text-sm font-medium rounded-lg hover:bg-brand/90 transition">
              + Add Blog Post
            </button>
          </div>
        </div>
      </header>

      <div class="p-5 fade-in">
        <!-- Filters -->
        <div class="flex items-center gap-3 mb-6">
          <button onclick="filterBlogs('all')" class="filter-btn active px-4 py-2 rounded-lg text-sm font-medium" data-filter="all">All</button>
          <button onclick="filterBlogs('published')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium" data-filter="published">Published</button>
          <button onclick="filterBlogs('draft')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium" data-filter="draft">Draft</button>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Title</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Author</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Status</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Date</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Actions</th>
                </tr>
              </thead>
              <tbody id="blogs-table" class="divide-y divide-gray-100">
                <tr><td colspan="5" class="px-4 py-8 text-center text-gray-400 text-sm">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Blog Modal -->
  <div id="blogModal" class="fixed inset-0 z-50 hidden">
    <div class="modal-overlay absolute inset-0" onclick="closeModal()"></div>
    <div class="modal-content absolute right-0 top-0 h-full w-full max-w-2xl bg-white shadow-2xl overflow-y-auto">
      <div class="sticky top-0 bg-white border-b border-gray-100 px-4 py-2.5 flex items-center justify-between z-10">
        <h3 class="font-bold text-gray-900" id="modal-title">Add Blog Post</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="blogForm" class="p-6 space-y-5" onsubmit="handleSubmit(event)">
        <input type="hidden" id="blog-id">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
          <input type="text" id="blog-title" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Excerpt</label>
          <textarea id="blog-excerpt" rows="3" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand resize-none"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Content</label>
          <textarea id="blog-content" rows="10" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand resize-y"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Image URL</label>
            <input type="url" id="blog-image" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Author</label>
            <input type="text" id="blog-author" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
          <select id="blog-status" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
          </select>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="submit" class="px-5 py-2.5 bg-brand text-white text-sm font-medium rounded-lg hover:bg-brand/90 transition">Save</button>
          <button type="button" onclick="closeModal()" class="px-5 py-2.5 bg-gray-100 text-gray-600 text-sm font-medium rounded-lg hover:bg-gray-200 transition">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const TOKEN = localStorage.getItem('admin_token');
    if (!TOKEN) window.location.href = '/admin/login.html';

    function logout() { localStorage.removeItem('admin_token'); localStorage.removeItem('admin_user'); window.location.href = '/admin/login.html'; }

    async function api(url, options = {}) {
      const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}`, ...options.headers } });
      if (res.status === 401) { logout(); return; }
      return res.json();
    }

    let currentFilter = 'all';

    function statusBadge(status) {
      const colors = { published: 'bg-green-100 text-green-700', draft: 'bg-yellow-100 text-yellow-700' };
      return `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium ${colors[status] || 'bg-gray-100 text-gray-700'}">${status}</span>`;
    }

    function escHtml(str) {
      const d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }

    function openModal(blog) {
      const form = document.getElementById('blogForm');
      form.reset();
      document.getElementById('blog-id').value = '';
      document.getElementById('modal-title').textContent = 'Add Blog Post';
      if (blog) {
        document.getElementById('modal-title').textContent = 'Edit Blog Post';
        document.getElementById('blog-id').value = blog.id || '';
        document.getElementById('blog-title').value = blog.title || '';
        document.getElementById('blog-excerpt').value = blog.excerpt || '';
        document.getElementById('blog-content').value = blog.content || '';
        document.getElementById('blog-image').value = blog.image_url || '';
        document.getElementById('blog-author').value = blog.author || '';
        document.getElementById('blog-status').value = blog.status || 'draft';
      }
      document.getElementById('blogModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('blogModal').classList.add('hidden'); }

    async function handleSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('blog-id').value;
      const body = {
        title: document.getElementById('blog-title').value.trim(),
        excerpt: document.getElementById('blog-excerpt').value.trim(),
        content: document.getElementById('blog-content').value.trim(),
        image_url: document.getElementById('blog-image').value.trim(),
        author: document.getElementById('blog-author').value.trim(),
        status: document.getElementById('blog-status').value,
      };
      if (id) {
        await api(`/api/blogs/${id}`, { method: 'PUT', body: JSON.stringify(body) });
      } else {
        await api('/api/blogs', { method: 'POST', body: JSON.stringify(body) });
      }
      closeModal();
      await loadBlogs();
    }

    async function filterBlogs(status) {
      currentFilter = status;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-filter="${status}"]`).classList.add('active');
      await loadBlogs();
    }

    async function loadBlogs() {
      const blogs = await api(`/api/blogs?status=${currentFilter}`);
      const tbody = document.getElementById('blogs-table');
      document.getElementById('blog-count').textContent = `${(blogs || []).length} posts`;

      if (!blogs || blogs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-gray-400 text-sm">No blog posts found</td></tr>';
        return;
      }

      tbody.innerHTML = blogs.map(b => `
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-2.5">
            <div class="font-medium text-sm text-gray-900 max-w-xs truncate">${escHtml(b.title)}</div>
            <div class="text-xs text-gray-400 mt-0.5 max-w-xs truncate">${escHtml(b.excerpt)}</div>
          </td>
          <td class="px-4 py-2.5 text-sm text-gray-600">${escHtml(b.author)}</td>
          <td class="px-4 py-2.5">${statusBadge(b.status)}</td>
          <td class="px-4 py-2.5 text-xs text-gray-400">${b.created_at ? new Date(b.created_at).toLocaleDateString() : 'N/A'}</td>
          <td class="px-4 py-2.5">
            <div class="flex items-center gap-2">
              <button onclick='editBlog(${JSON.stringify(b).replace(/'/g, "&#39;")})' class="px-3 py-1 bg-blue-50 text-blue-600 text-xs rounded-lg hover:bg-blue-100 font-medium">Edit</button>
              <button onclick="deleteBlog(${b.id})" class="px-3 py-1 bg-red-50 text-red-600 text-xs rounded-lg hover:bg-red-100 font-medium">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function editBlog(blog) {
      openModal(blog);
    }

    async function deleteBlog(id) {
      if (!confirm('Are you sure you want to delete this blog post?')) return;
      await api(`/api/blogs/${id}`, { method: 'DELETE' });
      await loadBlogs();
    }

    loadBlogs();
  </script>
</body>
</html>
