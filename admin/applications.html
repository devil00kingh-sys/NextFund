<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applications - NXT Fund Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: '#F24E2B', dark: '#0B0E14' } } }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .sidebar-link { transition: all 0.2s; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(242,78,43,0.1); color: #F24E2B; }
    .fade-in { animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    .modal-content { animation: slideUp 0.3s ease; }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .filter-btn { transition: all 0.2s; }
    .filter-btn.active { background: #F24E2B; color: white; }
    .filter-btn:not(.active) { background: white; color: #666; border: 1px solid #e5e7eb; }
    .filter-btn:not(.active):hover { border-color: #F24E2B; color: #F24E2B; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-56 bg-dark text-white flex-shrink-0 flex flex-col fixed h-full z-30">
      <div class="p-4 border-b border-white/10">
        <a href="/admin/" class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-brand flex items-center justify-center"><span class="text-white font-bold">N</span></div>
          <div><div class="font-bold text-sm">NXT Fund</div><div class="text-gray-400 text-xs">Admin Panel</div></div>
        </a>
      </div>
      <nav class="flex-1 p-4 space-y-1">
        <a href="/admin/" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </a>
        <a href="/admin/applications.html" class="sidebar-link active flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Applications
        </a>
        <a href="/admin/events.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Events
        </a>
        <a href="/admin/blogs.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
          Blog / News
        </a>
        <a href="/admin/startups.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          Startups
        </a>
        <a href="/admin/partners.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Partners
        </a>
        <a href="/admin/contacts.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          Contacts
        </a>
        <a href="/admin/settings.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Settings
        </a>
      </nav>
      <div class="p-4 border-t border-white/10">
        <a href="/" target="_blank" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          View Site
        </a>
        <button onclick="logout()" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 w-full">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-56">
      <header class="bg-white border-b border-gray-200 px-6 py-3 sticky top-0 z-20">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-xl font-bold text-gray-900">Applications</h1>
            <p class="text-gray-500 text-sm mt-0.5">Manage YC funding applications</p>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm text-gray-500" id="app-count">0 applications</span>
          </div>
        </div>
      </header>

      <div class="p-5 fade-in">
        <!-- Filters -->
        <div class="flex items-center gap-3 mb-6">
          <button onclick="filterApps('all')" class="filter-btn active px-4 py-2 rounded-lg text-sm font-medium" data-filter="all">All</button>
          <button onclick="filterApps('pending')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium" data-filter="pending">Pending</button>
          <button onclick="filterApps('approved')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium" data-filter="approved">Approved</button>
          <button onclick="filterApps('rejected')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium" data-filter="rejected">Rejected</button>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Founder</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Company</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Stage</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Media</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Batch</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Status</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Date</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Actions</th>
                </tr>
              </thead>
              <tbody id="apps-table" class="divide-y divide-gray-100">
                <tr><td colspan="7" class="px-4 py-8 text-center text-gray-400 text-sm">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="fixed inset-0 z-50 hidden">
    <div class="modal-overlay absolute inset-0" onclick="closeModal()"></div>
    <div class="modal-content absolute right-0 top-0 h-full w-full max-w-2xl bg-white shadow-2xl overflow-y-auto">
      <div class="sticky top-0 bg-white border-b border-gray-100 px-4 py-2.5 flex items-center justify-between z-10">
        <h3 class="font-bold text-gray-900">Application Details</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-content" class="p-6"></div>
    </div>
  </div>

  <script>
    const TOKEN = localStorage.getItem('admin_token');
    if (!TOKEN) window.location.href = '/admin/login.html';

    function logout() { localStorage.removeItem('admin_token'); localStorage.removeItem('admin_user'); window.location.href = '/admin/login.html'; }

    async function api(url, options = {}) {
      const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}`, ...options.headers } });
      if (res.status === 401) { logout(); return; }
      return res.json();
    }

    let currentFilter = 'all';

    function statusBadge(status) {
      const colors = { pending: 'bg-yellow-100 text-yellow-700', approved: 'bg-green-100 text-green-700', rejected: 'bg-red-100 text-red-700' };
      return `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium ${colors[status] || 'bg-gray-100 text-gray-700'}">${status}</span>`;
    }

    function stageBadge(stage) {
      return `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700">${stage || 'N/A'}</span>`;
    }

    function isPlayableVideo(file) {
      return /\.(mp4|webm|ogg|ogv|m4v|m4a)$/i.test(file);
    }

    function mediaIndicators(a) {
      let html = '<div class="flex items-center gap-2">';
      if (a.video_file) {
        const playable = a.video_file.startsWith('/assets/') || a.video_file.startsWith('http');
        html += `<span title="Video: ${a.video_file}" class="inline-flex items-center gap-1 text-[10px] font-medium ${playable ? 'bg-green-50 text-green-600 border border-green-200' : 'bg-amber-50 text-amber-600 border border-amber-200'} px-2 py-0.5 rounded-full">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          Video
        </span>`;
      }
      if (a.demo_file) {
        html += `<span title="Demo: ${a.demo_file}" class="inline-flex items-center gap-1 text-[10px] font-medium bg-blue-50 text-blue-600 border border-blue-200 px-2 py-0.5 rounded-full">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"/></svg>
          Demo
        </span>`;
      }
      if (!a.video_file && !a.demo_file) html += '<span class="text-xs text-gray-300">-</span>';
      html += '</div>';
      return html;
    }

    function formatMedia(app) {
      let html = '';
      if (app.video_file) {
        const isUploaded = app.video_file.startsWith('/assets/') || app.video_file.startsWith('http');
        const playable = isUploaded && isPlayableVideo(app.video_file);
        const vtype = /\.(mp4|m4v|m4a)$/i.test(app.video_file) ? 'video/mp4' : (/\.webm$/i.test(app.video_file) ? 'video/webm' : (/\.(ogg|ogv)$/i.test(app.video_file) ? 'video/ogg' : 'video/mp4'));
        html += `
          <div>
            <div class="text-xs text-gray-400 mb-2">Founder Video</div>
            ${playable
              ? `<video controls class="w-full rounded-lg border border-gray-200 bg-black" style="max-height:320px">
                   <source src="${app.video_file}" type="${vtype}">
                   Your browser does not support the video tag.
                 </video>
                 <a href="${app.video_file}" target="_blank" class="inline-flex items-center gap-1 text-xs text-brand font-medium mt-2 hover:underline">
                   Open video in new tab
                 </a>`
              : isUploaded
                ? `<div class="bg-gray-50 border border-gray-200 rounded-lg p-4 text-sm text-gray-600 flex items-center justify-between">
                     <div><span class="font-medium">File:</span> ${app.video_file} <span class="text-xs text-gray-400">(${extName(app.video_file)} not playable in browser, use download)</span></div>
                     <a href="${app.video_file}" target="_blank" download class="ml-3 px-3 py-1.5 bg-brand/10 text-brand border border-brand/20 rounded-lg text-xs font-medium hover:bg-brand hover:text-white transition">Download</a>
                   </div>`
                : `<div class="bg-gray-50 border border-gray-200 rounded-lg p-4 text-sm text-gray-600">
                     <span class="font-medium">File name:</span> ${app.video_file}
                   </div>`}
          </div>`;
      }
      if (app.demo_file) {
        const isUploaded = app.demo_file.startsWith('/assets/') || app.demo_file.startsWith('http');
        html += `
          <div>
            <div class="text-xs text-gray-400 mb-2">Demo File</div>
            ${isUploaded
              ? `<a href="${app.demo_file}" target="_blank" download class="inline-flex items-center gap-2 bg-brand/10 text-brand border border-brand/20 px-3 py-2 rounded-lg text-sm font-medium hover:bg-brand hover:text-white transition">
                   <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                   Download Demo (${app.demo_file})
                 </a>`
              : `<div class="bg-gray-50 border border-gray-200 rounded-lg p-4 text-sm text-gray-600">
                   <span class="font-medium">File name:</span> ${app.demo_file}
                 </div>`}
          </div>`;
      }
      return html;
    }

    function extName(path) {
      const m = String(path).match(/\.([^.\/]+$)/);
      return m ? m[1].toUpperCase() : 'FILE';
    }

    async function filterApps(status) {
      currentFilter = status;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-filter="${status}"]`).classList.add('active');
      await loadApps();
    }

    async function loadApps() {
      const apps = await api(`/api/applications?status=${currentFilter}`);
      const tbody = document.getElementById('apps-table');
      document.getElementById('app-count').textContent = `${(apps || []).length} applications`;

      if (!apps || apps.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="px-4 py-8 text-center text-gray-400 text-sm">No applications found</td></tr>';
        return;
      }

      tbody.innerHTML = apps.map(a => `
        <tr class="hover:bg-gray-50 cursor-pointer" onclick="viewApp('${a.id}')">
          <td class="px-4 py-2.5">
            <div class="font-medium text-sm text-gray-900">${a.founder_name || 'N/A'}</div>
            <div class="text-xs text-gray-400">${a.founder_email || ''}</div>
          </td>
          <td class="px-4 py-2.5 text-sm text-gray-600">${a.company_name || 'N/A'}</td>
          <td class="px-4 py-2.5">${stageBadge(a.stage)}</td>
          <td class="px-4 py-2.5">${mediaIndicators(a)}</td>
          <td class="px-4 py-2.5 text-sm text-gray-500">${a.batch_preference || 'N/A'}</td>
          <td class="px-4 py-2.5">${statusBadge(a.status)}</td>
          <td class="px-4 py-2.5 text-xs text-gray-400">${a.submitted_at ? new Date(a.submitted_at).toLocaleDateString() : 'N/A'}</td>
          <td class="px-4 py-2.5">
            <div class="flex items-center gap-2" onclick="event.stopPropagation()">
              ${a.status === 'pending' ? `
                <button onclick="updateStatus('${a.id}', 'approved')" class="px-3 py-1 bg-green-500 text-white text-xs rounded-lg hover:bg-green-600">Approve</button>
                <button onclick="updateStatus('${a.id}', 'rejected')" class="px-3 py-1 bg-red-500 text-white text-xs rounded-lg hover:bg-red-600">Reject</button>
              ` : ''}
              <button onclick="deleteApp('${a.id}')" class="px-3 py-1 bg-gray-100 text-gray-600 text-xs rounded-lg hover:bg-gray-200">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function viewApp(id) {
      const app = await api(`/api/applications/${id}`);
      if (!app) return;
      const modal = document.getElementById('detailModal');
      const content = document.getElementById('modal-content');

      content.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-lg font-bold text-gray-900">${app.company_name || 'N/A'}</h2>
              <p class="text-sm text-gray-500">${app.founder_name || 'N/A'} &middot; ${app.founder_email || ''}</p>
            </div>
            <div class="flex gap-2">
              ${statusBadge(app.status)}
              ${stageBadge(app.stage)}
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="bg-gray-50 rounded-lg p-4"><div class="text-xs text-gray-400 mb-1">LinkedIn</div><div class="text-sm font-medium">${app.founder_linkedin || 'N/A'}</div></div>
            <div class="bg-gray-50 rounded-lg p-4"><div class="text-xs text-gray-400 mb-1">Role</div><div class="text-sm font-medium">${app.founder_role || 'N/A'}</div></div>
            <div class="bg-gray-50 rounded-lg p-4"><div class="text-xs text-gray-400 mb-1">Website</div><div class="text-sm font-medium">${app.company_url || 'N/A'}</div></div>
            <div class="bg-gray-50 rounded-lg p-4"><div class="text-xs text-gray-400 mb-1">Location</div><div class="text-sm font-medium">${app.company_location || 'N/A'}</div></div>
            <div class="bg-gray-50 rounded-lg p-4"><div class="text-xs text-gray-400 mb-1">Monthly Expenses</div><div class="text-sm font-medium">${app.monthly_expenses || 'N/A'}</div></div>
            <div class="bg-gray-50 rounded-lg p-4"><div class="text-xs text-gray-400 mb-1">Monthly Revenue</div><div class="text-sm font-medium">${app.monthly_revenue || 'N/A'}</div></div>
            <div class="bg-gray-50 rounded-lg p-4"><div class="text-xs text-gray-400 mb-1">Active Users</div><div class="text-sm font-medium">${app.active_users || 'N/A'}</div></div>
            <div class="bg-gray-50 rounded-lg p-4"><div class="text-xs text-gray-400 mb-1">Requested Amount</div><div class="text-sm font-medium">${app.requested_amount || 'N/A'}</div></div>
            <div class="bg-gray-50 rounded-lg p-4"><div class="text-xs text-gray-400 mb-1">Batch</div><div class="text-sm font-medium">${app.batch_preference || 'N/A'}</div></div>
            <div class="bg-gray-50 rounded-lg p-4"><div class="text-xs text-gray-400 mb-1">Incorporated</div><div class="text-sm font-medium">${app.incorporated || 'N/A'}</div></div>
          </div>

          <div><div class="text-xs text-gray-400 mb-1">Company Description</div><p class="text-sm text-gray-700">${app.company_description || 'N/A'}</p></div>
          <div><div class="text-xs text-gray-400 mb-1">Product Description</div><p class="text-sm text-gray-700">${app.product_description || 'N/A'}</p></div>
          <div><div class="text-xs text-gray-400 mb-1">Motivation</div><p class="text-sm text-gray-700">${app.motivation || 'N/A'}</p></div>
          <div><div class="text-xs text-gray-400 mb-1">Novelty</div><p class="text-sm text-gray-700">${app.novelty || 'N/A'}</p></div>
          <div><div class="text-xs text-gray-400 mb-1">Competitors</div><p class="text-sm text-gray-700">${app.competitors || 'N/A'}</p></div>
          <div><div class="text-xs text-gray-400 mb-1">Unique Insight</div><p class="text-sm text-gray-700">${app.unique_insight || 'N/A'}</p></div>
          <div><div class="text-xs text-gray-400 mb-1">Business Model</div><p class="text-sm text-gray-700">${app.business_model || 'N/A'}</p></div>

          ${formatMedia(app)}

          <div class="flex gap-3 pt-4 border-t border-gray-100">
            ${app.status === 'pending' ? `
              <button onclick="updateStatus('${app.id}', 'approved'); closeModal()" class="px-4 py-2 bg-green-500 text-white text-sm font-medium rounded-lg hover:bg-green-600">Approve</button>
              <button onclick="updateStatus('${app.id}', 'rejected'); closeModal()" class="px-4 py-2 bg-red-500 text-white text-sm font-medium rounded-lg hover:bg-red-600">Reject</button>
            ` : ''}
            <button onclick="deleteApp('${app.id}'); closeModal()" class="px-4 py-2 bg-gray-100 text-gray-600 text-sm font-medium rounded-lg hover:bg-gray-200 ml-auto">Delete</button>
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
    }

    function closeModal() { document.getElementById('detailModal').classList.add('hidden'); }

    async function updateStatus(id, status) {
      await api(`/api/applications/${id}`, { method: 'PUT', body: JSON.stringify({ status }) });
      loadApps();
    }

    async function deleteApp(id) {
      if (!confirm('Are you sure you want to delete this application?')) return;
      await api(`/api/applications/${id}`, { method: 'DELETE' });
      loadApps();
    }

    loadApps();
  </script>
</body>
</html>
