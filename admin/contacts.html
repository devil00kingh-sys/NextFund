<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts - NXT Fund Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: '#F24E2B', dark: '#0B0E14' } } }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .sidebar-link { transition: all 0.2s; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(242,78,43,0.1); color: #F24E2B; }
    .fade-in { animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    .modal-content { animation: slideUp 0.3s ease; }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .filter-btn { transition: all 0.2s; }
    .filter-btn.active { background: #F24E2B; color: white; }
    .filter-btn:not(.active) { background: white; color: #666; border: 1px solid #e5e7eb; }
    .filter-btn:not(.active):hover { border-color: #F24E2B; color: #F24E2B; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-56 bg-dark text-white flex-shrink-0 flex flex-col fixed h-full z-30">
      <div class="p-4 border-b border-white/10">
        <a href="/admin/" class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-brand flex items-center justify-center"><span class="text-white font-bold">N</span></div>
          <div><div class="font-bold text-sm">NXT Fund</div><div class="text-gray-400 text-xs">Admin Panel</div></div>
        </a>
      </div>
      <nav class="flex-1 p-4 space-y-1">
        <a href="/admin/" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </a>
        <a href="/admin/applications.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Applications
        </a>
        <a href="/admin/events.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Events
        </a>
        <a href="/admin/blogs.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
          Blog / News
        </a>
        <a href="/admin/startups.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          Startups
        </a>
        <a href="/admin/partners.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Partners
        </a>
        <a href="/admin/contacts.html" class="sidebar-link active flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          Contacts
        </a>
        <a href="/admin/settings.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Settings
        </a>
      </nav>
      <div class="p-4 border-t border-white/10">
        <a href="/" target="_blank" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          View Site
        </a>
        <button onclick="logout()" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 w-full">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-56">
      <header class="bg-white border-b border-gray-200 px-6 py-3 sticky top-0 z-20">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-xl font-bold text-gray-900">Contact Messages</h1>
            <p class="text-gray-500 text-sm mt-0.5">View and manage contact form submissions</p>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm text-gray-500" id="contact-count">0 messages</span>
          </div>
        </div>
      </header>

      <div class="p-5 fade-in">
        <!-- Filters -->
        <div class="flex items-center gap-3 mb-6">
          <button onclick="filterContacts('all')" class="filter-btn active px-4 py-2 rounded-lg text-sm font-medium" data-filter="all">All</button>
          <button onclick="filterContacts('unread')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium" data-filter="unread">Unread</button>
          <button onclick="filterContacts('read')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium" data-filter="read">Read</button>
          <button onclick="filterContacts('replied')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium" data-filter="replied">Replied</button>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Name</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Email</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Subject</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Status</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Date</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Actions</th>
                </tr>
              </thead>
              <tbody id="contacts-table" class="divide-y divide-gray-100">
                <tr><td colspan="6" class="px-4 py-8 text-center text-gray-400 text-sm">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="fixed inset-0 z-50 hidden">
    <div class="modal-overlay absolute inset-0" onclick="closeModal()"></div>
    <div class="modal-content absolute right-0 top-0 h-full w-full max-w-2xl bg-white shadow-2xl overflow-y-auto">
      <div class="sticky top-0 bg-white border-b border-gray-100 px-4 py-2.5 flex items-center justify-between z-10">
        <h3 class="font-bold text-gray-900">Message Details</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-content" class="p-6"></div>
    </div>
  </div>

  <script>
    const TOKEN = localStorage.getItem('admin_token');
    if (!TOKEN) window.location.href = '/admin/login.html';

    function logout() { localStorage.removeItem('admin_token'); localStorage.removeItem('admin_user'); window.location.href = '/admin/login.html'; }

    async function api(url, options = {}) {
      const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}`, ...options.headers } });
      if (res.status === 401) { logout(); return; }
      return res.json();
    }

    let currentFilter = 'all';

    function statusBadge(status) {
      if (status === 'unread') {
        return `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700"><span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>Unread</span>`;
      }
      if (status === 'read') {
        return `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-700">Read</span>`;
      }
      if (status === 'replied') {
        return `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700">Replied</span>`;
      }
      return `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-700">${status || 'Unknown'}</span>`;
    }

    async function filterContacts(status) {
      currentFilter = status;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-filter="${status}"]`).classList.add('active');
      await loadContacts();
    }

    async function loadContacts() {
      const contacts = await api(`/api/contacts?status=${currentFilter}`);
      const tbody = document.getElementById('contacts-table');
      const list = contacts || [];
      document.getElementById('contact-count').textContent = `${list.length} messages`;

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-400 text-sm">No contact messages found</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(c => `
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-2.5">
            <div class="font-medium text-sm text-gray-900">${c.name || 'N/A'}</div>
          </td>
          <td class="px-4 py-2.5 text-sm text-gray-600">${c.email || 'N/A'}</td>
          <td class="px-4 py-2.5 text-sm text-gray-600">${c.subject || 'N/A'}</td>
          <td class="px-4 py-2.5">${statusBadge(c.status)}</td>
          <td class="px-4 py-2.5 text-xs text-gray-400">${c.created_at ? new Date(c.created_at).toLocaleDateString() : 'N/A'}</td>
          <td class="px-4 py-2.5">
            <div class="flex items-center gap-2">
              <button onclick="viewContact(${c.id})" class="px-3 py-1 bg-brand text-white text-xs rounded-lg hover:opacity-90">View</button>
              ${c.status === 'unread' ? `<button onclick="markAs(${c.id}, 'read')" class="px-3 py-1 bg-blue-500 text-white text-xs rounded-lg hover:bg-blue-600">Mark Read</button>` : ''}
              ${c.status !== 'replied' ? `<button onclick="markAs(${c.id}, 'replied')" class="px-3 py-1 bg-green-500 text-white text-xs rounded-lg hover:bg-green-600">Mark Replied</button>` : ''}
              <button onclick="deleteContact(${c.id})" class="px-3 py-1 bg-gray-100 text-gray-600 text-xs rounded-lg hover:bg-gray-200">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function viewContact(id) {
      const contact = await api(`/api/contacts/${id}`);
      if (!contact) return;

      if (contact.status === 'unread') {
        await api(`/api/contacts/${id}`, { method: 'PUT', body: JSON.stringify({ status: 'read' }) });
      }

      const modal = document.getElementById('detailModal');
      const content = document.getElementById('modal-content');

      content.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-lg font-bold text-gray-900">${contact.name || 'N/A'}</h2>
              <p class="text-sm text-gray-500">${contact.email || ''}</p>
            </div>
            <div>${statusBadge(contact.status)}</div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="bg-gray-50 rounded-lg p-4"><div class="text-xs text-gray-400 mb-1">Subject</div><div class="text-sm font-medium">${contact.subject || 'N/A'}</div></div>
            <div class="bg-gray-50 rounded-lg p-4"><div class="text-xs text-gray-400 mb-1">Phone</div><div class="text-sm font-medium">${contact.phone || 'N/A'}</div></div>
            <div class="bg-gray-50 rounded-lg p-4"><div class="text-xs text-gray-400 mb-1">Date</div><div class="text-sm font-medium">${contact.created_at ? new Date(contact.created_at).toLocaleString() : 'N/A'}</div></div>
            <div class="bg-gray-50 rounded-lg p-4"><div class="text-xs text-gray-400 mb-1">Status</div><div class="text-sm font-medium capitalize">${contact.status || 'N/A'}</div></div>
          </div>

          <div>
            <div class="text-xs text-gray-400 mb-2">Message</div>
            <div class="bg-gray-50 rounded-lg p-4">
              <p class="text-sm text-gray-700 whitespace-pre-wrap">${contact.message || 'No message provided.'}</p>
            </div>
          </div>

          <div class="flex gap-3 pt-4 border-t border-gray-100">
            <a href="mailto:${contact.email}" class="px-4 py-2 bg-brand text-white text-sm font-medium rounded-lg hover:opacity-90 inline-flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              Reply via Email
            </a>
            ${contact.status !== 'replied' ? `<button onclick="markAs(${contact.id}, 'replied'); closeModal()" class="px-4 py-2 bg-green-500 text-white text-sm font-medium rounded-lg hover:bg-green-600">Mark as Replied</button>` : ''}
            <button onclick="deleteContact(${contact.id}); closeModal()" class="px-4 py-2 bg-gray-100 text-gray-600 text-sm font-medium rounded-lg hover:bg-gray-200 ml-auto">Delete</button>
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
      loadContacts();
    }

    function closeModal() { document.getElementById('detailModal').classList.add('hidden'); }

    async function markAs(id, status) {
      await api(`/api/contacts/${id}`, { method: 'PUT', body: JSON.stringify({ status }) });
      loadContacts();
    }

    async function deleteContact(id) {
      if (!confirm('Are you sure you want to delete this contact message?')) return;
      await api(`/api/contacts/${id}`, { method: 'DELETE' });
      loadContacts();
    }

    loadContacts();
  </script>
</body>
</html>
