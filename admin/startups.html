<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startups - NXT Fund Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: '#F24E2B', dark: '#0B0E14' } } }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .sidebar-link { transition: all 0.2s; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(242,78,43,0.1); color: #F24E2B; }
    .fade-in { animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    .modal-content { animation: slideUp 0.3s ease; }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .filter-btn { transition: all 0.2s; }
    .filter-btn.active { background: #F24E2B; color: white; }
    .filter-btn:not(.active) { background: white; color: #666; border: 1px solid #e5e7eb; }
    .filter-btn:not(.active):hover { border-color: #F24E2B; color: #F24E2B; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-56 bg-dark text-white flex-shrink-0 flex flex-col fixed h-full z-30">
      <div class="p-4 border-b border-white/10">
        <a href="/admin/" class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-brand flex items-center justify-center"><span class="text-white font-bold">N</span></div>
          <div><div class="font-bold text-sm">NXT Fund</div><div class="text-gray-400 text-xs">Admin Panel</div></div>
        </a>
      </div>
      <nav class="flex-1 p-4 space-y-1">
        <a href="/admin/" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </a>
        <a href="/admin/applications.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Applications
        </a>
        <a href="/admin/events.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Events
        </a>
        <a href="/admin/blogs.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
          Blog / News
        </a>
        <a href="/admin/startups.html" class="sidebar-link active flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          Startups
        </a>
        <a href="/admin/partners.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Partners
        </a>
        <a href="/admin/contacts.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          Contacts
        </a>
        <a href="/admin/settings.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Settings
        </a>
      </nav>
      <div class="p-4 border-t border-white/10">
        <a href="/" target="_blank" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          View Site
        </a>
        <button onclick="logout()" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 w-full">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-56">
      <header class="bg-white border-b border-gray-200 px-6 py-3 sticky top-0 z-20">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-xl font-bold text-gray-900">Startups</h1>
            <p class="text-gray-500 text-sm mt-0.5">Manage portfolio startups</p>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm text-gray-500" id="startup-count">0 startups</span>
            <button onclick="openAddModal()" class="px-4 py-2 bg-brand text-white text-sm font-medium rounded-lg hover:bg-orange-600 transition-colors">
              + Add Startup
            </button>
          </div>
        </div>
      </header>

      <div class="p-5 fade-in">
        <!-- Filters -->
        <div class="flex items-center gap-3 mb-6">
          <button onclick="filterStartups('all')" class="filter-btn active px-4 py-2 rounded-lg text-sm font-medium" data-filter="all">All</button>
          <button onclick="filterStartups('active')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium" data-filter="active">Active</button>
          <button onclick="filterStartups('inactive')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium" data-filter="inactive">Inactive</button>
        </div>

        <!-- Cards Grid -->
        <div id="startups-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <div class="col-span-full text-center py-12 text-gray-400 text-sm">Loading...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div id="formModal" class="fixed inset-0 z-50 hidden">
    <div class="modal-overlay absolute inset-0" onclick="closeFormModal()"></div>
    <div class="modal-content absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
        <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
          <h3 class="font-bold text-gray-900" id="modal-title">Add Startup</h3>
          <button onclick="closeFormModal()" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <form id="startup-form" onsubmit="handleFormSubmit(event)" class="p-5 space-y-3">
          <input type="hidden" id="form-id">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
            <input type="text" id="form-name" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea id="form-description" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand resize-none"></textarea>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Logo URL</label>
              <input type="url" id="form-logo" placeholder="https://..." class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Website</label>
              <input type="url" id="form-website" placeholder="https://..." class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Sector</label>
              <input type="text" id="form-sector" placeholder="e.g. FinTech" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
              <select id="form-status" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand bg-white">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
          </div>
          <div class="flex items-center gap-3 pt-4 border-t border-gray-100">
            <button type="submit" class="px-5 py-2.5 bg-brand text-white text-sm font-medium rounded-lg hover:bg-orange-600 transition-colors" id="form-submit-btn">Save Startup</button>
            <button type="button" onclick="closeFormModal()" class="px-5 py-2.5 bg-gray-100 text-gray-600 text-sm font-medium rounded-lg hover:bg-gray-200 transition-colors">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const TOKEN = localStorage.getItem('admin_token');
    if (!TOKEN) window.location.href = '/admin/login.html';

    function logout() { localStorage.removeItem('admin_token'); localStorage.removeItem('admin_user'); window.location.href = '/admin/login.html'; }

    async function api(url, options = {}) {
      const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}`, ...options.headers } });
      if (res.status === 401) { logout(); return; }
      return res.json();
    }

    let currentFilter = 'all';
    let allStartups = [];

    function statusBadge(status) {
      const colors = { active: 'bg-green-100 text-green-700', inactive: 'bg-red-100 text-red-700' };
      return `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium ${colors[status] || 'bg-gray-100 text-gray-700'}">${status || 'unknown'}</span>`;
    }

    async function filterStartups(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
      renderStartups();
    }

    function renderStartups() {
      const filtered = currentFilter === 'all' ? allStartups : allStartups.filter(s => s.status === currentFilter);
      const grid = document.getElementById('startups-grid');
      document.getElementById('startup-count').textContent = `${filtered.length} startup${filtered.length !== 1 ? 's' : ''}`;

      if (!filtered || filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400 text-sm">No startups found</div>';
        return;
      }

      grid.innerHTML = filtered.map(s => `
        <div class="bg-white rounded-xl border border-gray-100 p-4 hover:shadow-md transition-shadow">
          <div class="flex items-start justify-between mb-4">
            <div class="flex items-center gap-3">
              ${s.logo_url
                ? `<img src="${s.logo_url}" alt="${s.name}" class="w-10 h-10 rounded-lg object-cover bg-gray-100">`
                : `<div class="w-10 h-10 rounded-lg bg-brand/10 flex items-center justify-center"><span class="text-brand font-bold text-sm">${(s.name || '?')[0].toUpperCase()}</span></div>`
              }
              <div>
                <h3 class="font-semibold text-gray-900 text-sm">${s.name || 'N/A'}</h3>
                <span class="text-xs text-gray-400">${s.sector || 'N/A'}</span>
              </div>
            </div>
            ${statusBadge(s.status)}
          </div>
          <p class="text-sm text-gray-500 mb-4 line-clamp-2 min-h-[40px]">${s.description || 'No description'}</p>
          <div class="flex items-center justify-between pt-4 border-t border-gray-100">
            ${s.website
              ? `<a href="${s.website}" target="_blank" class="text-xs text-brand hover:underline flex items-center gap-1">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                  Visit
                </a>`
              : '<span></span>'
            }
            <div class="flex items-center gap-2">
              <button onclick="openEditModal(${s.id})" class="px-3 py-1.5 bg-gray-100 text-gray-600 text-xs rounded-lg hover:bg-gray-200 transition-colors flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                Edit
              </button>
              <button onclick="deleteStartup(${s.id})" class="px-3 py-1.5 bg-red-50 text-red-600 text-xs rounded-lg hover:bg-red-100 transition-colors flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                Delete
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function loadStartups() {
      const startups = await api('/api/startups');
      allStartups = Array.isArray(startups) ? startups : (startups?.data || startups?.startups || []);
      renderStartups();
    }

    function openAddModal() {
      document.getElementById('form-id').value = '';
      document.getElementById('form-name').value = '';
      document.getElementById('form-description').value = '';
      document.getElementById('form-logo').value = '';
      document.getElementById('form-website').value = '';
      document.getElementById('form-sector').value = '';
      document.getElementById('form-status').value = 'active';
      document.getElementById('modal-title').textContent = 'Add Startup';
      document.getElementById('form-submit-btn').textContent = 'Save Startup';
      document.getElementById('formModal').classList.remove('hidden');
    }

    async function openEditModal(id) {
      const startup = allStartups.find(s => s.id === id);
      if (!startup) return;
      document.getElementById('form-id').value = startup.id;
      document.getElementById('form-name').value = startup.name || '';
      document.getElementById('form-description').value = startup.description || '';
      document.getElementById('form-logo').value = startup.logo_url || '';
      document.getElementById('form-website').value = startup.website || '';
      document.getElementById('form-sector').value = startup.sector || '';
      document.getElementById('form-status').value = startup.status || 'active';
      document.getElementById('modal-title').textContent = 'Edit Startup';
      document.getElementById('form-submit-btn').textContent = 'Update Startup';
      document.getElementById('formModal').classList.remove('hidden');
    }

    function closeFormModal() { document.getElementById('formModal').classList.add('hidden'); }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('form-id').value;
      const payload = {
        name: document.getElementById('form-name').value.trim(),
        description: document.getElementById('form-description').value.trim(),
        logo_url: document.getElementById('form-logo').value.trim(),
        website: document.getElementById('form-website').value.trim(),
        sector: document.getElementById('form-sector').value.trim(),
        status: document.getElementById('form-status').value
      };

      if (id) {
        await api(`/api/startups/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
      } else {
        await api('/api/startups', { method: 'POST', body: JSON.stringify(payload) });
      }

      closeFormModal();
      await loadStartups();
    }

    async function deleteStartup(id) {
      if (!confirm('Are you sure you want to delete this startup?')) return;
      await api(`/api/startups/${id}`, { method: 'DELETE' });
      await loadStartups();
    }

    loadStartups();
  </script>
</body>
</html>
